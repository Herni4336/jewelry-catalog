<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Әшекей бұйымдар каталогы</title>
    <!-- Сыртқы стильдерді қосу -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Менің әшекейлер галереям</h1>
        <p>Эксклюзивті қолдан жасалған бұйымдар</p>
    </header>

    <!-- Фильтрлер -->
    <div class="tabs">
        <button class="tab-btn active" data-category="all">Барлығы</button>
        <button class="tab-btn" data-category="rings">Жүзіктер</button>
        <button class="tab-btn" data-category="earrings">Сырғалар</button>
    </div>

    <!-- Галерея торкөзі -->
    <div class="gallery" id="jewelry-gallery"></div>

    <!-- Модальді терезе (CSS арқылы әдепкіде жасырылған) -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal-btn">&times;</span>
            <img class="modal-img" id="modal-img" src="" alt="">
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-price" id="modal-price"></div>

            <table class="specs-table">
                <tr>
                    <td>Металл түрі:</td>
                    <td id="modal-metal">-</td>
                </tr>
                <tr>
                    <td>Сынамасы (Проба):</td>
                    <td id="modal-probe">-</td>
                </tr>
                <tr>
                    <td>Салмағы:</td>
                    <td id="modal-weight">-</td>
                </tr>
                <tr>
                    <td>Бөліп төлеу (24 ай):</td>
                    <td id="modal-installment">-</td>
                </tr>
                <tr>
                    <td>Түпнұсқалылығы:</td>
                    <td id="modal-auth">-</td>
                </tr>
            </table>
            <p id="modal-desc"></p>

            <div class="modal-actions">
                <a href="#" id="modal-wa-btn" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
                    Тапсырыс беру (WhatsApp)
                </a>
                <button class="share-btn" id="modal-share-btn" title="Бөлісу">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Сыртқы логиканы қосу -->
    <script src="js/app.js"></script>
</body>

</html>
