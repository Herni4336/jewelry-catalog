<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Украшений</title>
    <style>
        @import url('https://googleapis.com');

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfbf7;
            color: #2c2c2c;
        }

        header {
            background-color: transparent;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-family: 'Georgia', serif;
            margin: 0 0 10px 0;
            font-size: 32px;
            letter-spacing: 2px;
            font-weight: 400;
            text-transform: uppercase;
        }

        header p {
            margin: 0;
            font-size: 14px;
            color: #8c7e65;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            /* Слегка увеличили расстояние для объема */
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto 60px auto;
        }

        /* Наводим красоту на карточки и добавляем сочные, заметные тени */
        .card {
            background-color: #fff;
            border-radius: 16px;
            /* Более мягкие премиальные углы */
            overflow: hidden;
            /* Плотная, контрастная, но мягкая тень, которая четко выделяет рамки */
            box-shadow: 0 15px 35px rgba(44, 44, 44, 0.08), 0 5px 15px rgba(184, 151, 66, 0.06);
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            border: 1px solid rgba(184, 151, 66, 0.15);
        }

        /* Эффектный объем при наведении */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 22px 45px rgba(44, 44, 44, 0.15), 0 8px 20px rgba(184, 151, 66, 0.1);
        }

        /* Контейнер под фото, чтобы украшения влезали ПОЛНОСТЬЮ */
        .card img {
            width: 90%;
            /* Оставляем зазоры по бокам */
            height: 340px;
            object-fit: contain;
            /* Картинка сжимается пропорционально и никогда не обрезается! */
            padding: 20px 5% 0 5%;
            /* Внутренние отступы сверху и по бокам */
            background-color: #fff;
        }

        .card-info {
            padding: 25px 20px;
            background-color: #fff;
        }

        .card-title {
            font-family: 'Georgia', serif;
            font-size: 19px;
            margin: 0 0 12px 0;
            font-weight: 500;
            line-height: 1.4;
        }

        .card-price {
            font-size: 18px;
            color: #bc9c4b;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Моя Галерея Украшений</h1>
        <p>Эксклюзивные изделия ручной работы</p>
    </header>

    <div class="gallery" id="jewelry-gallery"></div>

    <script>
        async function loadCatalog() {
            try {
                const response = await fetch('data.json');
                const products = await response.json();
                const gallery = document.getElementById('jewelry-gallery');

                gallery.innerHTML = '';

                products.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.alt || 'Украшение'}">
                        <div class="card-info">
                            <p class="card-title">${item.title}</p>
                            <p class="card-price">${item.price}</p>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка загрузки каталога:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>

</html>
