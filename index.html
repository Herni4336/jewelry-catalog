<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Әшекей бұйымдар каталогы</title>
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Менің әшекейлер галереям</h1>
        <p>Эксклюзивті қолдан жасалған бұйымдар</p>
    </header>

    <!-- Фильтры -->
    <div class="tabs">
        <button class="tab-btn active" data-category="all">Барлығы</button>
        <button class="tab-btn" data-category="rings">Жүзіктер</button>
        <button class="tab-btn" data-category="earrings">Сырғалар</button>
    </div>

    <!-- Сетка галереи -->
    <div class="gallery" id="jewelry-gallery"></div>

    <!-- Модальное окно (По умолчанию скрыто через CSS) -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal-btn">&times;</span>
            <img class="modal-img" id="modal-img" src="" alt="">
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-price" id="modal-price"></div>

            <table class="specs-table">
                <tr>
                    <td>Металл түрі:</td>
                    <td id="modal-metal">-</td>
                </tr>
                <tr>
                    <td>Сынамасы (Проба):</td>
                    <td id="modal-probe">-</td>
                </tr>
                <tr>
                    <td>Түпнұсқалылығы:</td>
                    <td id="modal-auth">-</td>
                </tr>
            </table>
            <p id="modal-desc"></p>

            <a href="#" id="modal-wa-btn" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">Тапсырыс беру (WhatsApp)</a>
        </div>
    </div>

    <!-- Подключаем внешнюю логику -->
    <script src="js/app.js"></script>
</body>

</html>
